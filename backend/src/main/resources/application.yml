server:
  port: ${PORT:8080}

spring:
  application:
    name: kiyuziyu-api

firebase:
  project-id: ${FIREBASE_PROJECT_ID:kiyuziyu-7ca67}
  client-email: ${FIREBASE_CLIENT_EMAIL:}
  private-key: ${FIREBASE_PRIVATE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

shopify:
  store-domain: ${SHOPIFY_STORE_DOMAIN:}
  access-token: ${SHOPIFY_ACCESS_TOKEN:}
  client-id: ${SHOPIFY_CLIENT_ID:50616f42c3e0cfbb5ba9f29a2143acf6}
  client-secret: ${SHOPIFY_CLIENT_SECRET:}
  webhook-secret: ${SHOPIFY_WEBHOOK_SECRET:}
  api-version: ${SHOPIFY_API_VERSION:2026-07}
  oauth:
    redirect-uri: ${SHOPIFY_REDIRECT_URI:https://kiyuziyu-api-703805908757.asia-south1.run.app/api/v1/shopify/oauth/callback}
    scopes: ${SHOPIFY_SCOPES:write_products,write_inventory}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}

